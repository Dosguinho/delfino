<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfino Odílio | Portfólio TI</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid #00f3ff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #00f3ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #bc13fe;
            font-weight: bold;
            margin-bottom: 2rem;
        }
        .section {
            text-align: left;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .badge {
            background: transparent;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Delfino Odílio</h1>
        <div class="subtitle">Jovem Aprendiz • Suporte TI • Logística</div>
        
        <div class="section">
            <strong>Experiência:</strong> Marvão (Adm/Logística)
        </div>
        <div class="section">
            <strong>Habilidades:</strong> Python, SQL, Excel VBA
        </div>
        <div class="section">
            <strong>Certificações:</strong> Google IT Support, SEBRAE
        </div>
        
        <br>
        <div>
            <span class="badge">Teresina, PI</span>
            <span class="badge">Inovação</span>
        </div>
    </div>
</body>
</html>
