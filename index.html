<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfino Odílio | Portfólio Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #bc13fe;
            --dark-bg: #121214;
            --card-bg: #1c1c21;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Efeito de fundo sutil */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
            z-index: -1;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            position: relative;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* Bordas Neon Animadas Estilo Imagem */
        .card::after {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 14px;
            border: 2px solid var(--cyan);
            clip-path: inset(0 0 0 0 round 14px);
            filter: drop-shadow(0 0 10px var(--cyan));
            z-index: -1;
            opacity: 0.8;
        }

        .content {
            z-index: 1;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .subtitle-box {
            display: inline-block;
            border: 1px solid var(--purple);
            padding: 5px 15px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .info-list {
            list-style: none;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #d1d1d1;
        }

        .icon {
            margin-right: 15px;
            color: var(--purple);
            font-size: 1.4rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .tag {
            border: 1.5px solid var(--cyan);
            color: var(--cyan);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0, 243, 255, 0.05);
            transition: 0.3s;
        }

        .tag:hover {
            background: var(--cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--cyan);
        }

        /* Estilização de Scroll para mobile */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="content">
            <h1>Delfino Odílio</h1>
            <div class="subtitle-box">
                JOVEM APRENDIZ • SUPORTE TI • LOGÍSTICA
            </div>

            <ul class="info-list">
                <li class="info-item">
                    <span class="icon">🚀</span> 
                    Habilidades: Python, SQL, Excel VBA
                </li>
                <li class="info-item">
                    <span class="icon">🎓</span> 
                    Certificações: Google IT Support / SEBRAE
                </li>
                <li class="info-item">
                    <span class="icon">💼</span> 
                    Experiência: Adm & Logística (Marvão)
                </li>
                <li class="info-item">
                    <span class="icon">📍</span> 
                    Teresina, PI
                </li>
            </ul>

            <div class="tags-container">
                <div class="tag">Tecnologia</div>
                <div class="tag">Administração</div>
                <div class="tag">Análise</div>
                <div class="tag">Inovação</div>
            </div>
        </div>
    </div>

</body>
</html>
